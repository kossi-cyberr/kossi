<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>SES - Survival Escalade - Kossi Jean Bertin</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      margin: 0;
      padding: 0;
      background: #030308;
      color: #fff;
      font-family: 'Courier New', monospace;
    }

    body {
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      padding-left: env(safe-area-inset-left, 0px);
      padding-right: env(safe-area-inset-right, 0px);
    }

    /* Conteneur principal - Responsive */
    #game-wrapper {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* Canvas - Flexibe */
    #gameCanvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #030308;
      cursor: crosshair;
      touch-action: none;
    }

    /* Signature */
    #signature {
      position: absolute;
      bottom: 10px;
      left: 10px;
      font-size: 10px;
      color: rgba(255, 255, 255, 0.5);
      font-family: 'Courier New', monospace;
      pointer-events: none;
      z-index: 10;
      letter-spacing: 1px;
    }

    #signature strong {
      color: #0f0;
      font-weight: bold;
    }

    /* HUD - Ajustable selon l'écran */
    #hud {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      justify-content: space-between;
      padding: 10px 15px;
      pointer-events: none;
      z-index: 10;
      flex-direction: column;
    }

    #hud .stat {
      background: rgba(0, 0, 0, 0.6);
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      text-align: center;
      min-width: 80px;
    }

    #hud .stat .label {
      font-size: 8px;
      color: rgba(255, 255, 255, 0.6);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    #hud .stat .value {
      font-size: 16px;
      font-weight: bold;
      color: #0f0;
    }

    #hud .stat .value.level {
      color: #00f;
    }

    #restart-btn {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 24px;
      background: transparent;
      color: #fff;
      border: 2px solid #0f0;
      border-radius: 6px;
      font-family: 'Courier New', monospace;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      pointer-events: auto;
      transition: all 0.2s;
      text-transform: uppercase;
      letter-spacing: 1px;
      z-index: 10;
    }

    #restart-btn:hover {
      background: #0f0;
      color: #000;
      transform: translateX(-50%) scale(1.05);
    }

    /* Game Over */
    #game-over {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: none;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      gap: 15px;
      z-index: 20;
    }

    #game-over h1 {
      font-size: 44px;
      color: #f00;
      text-shadow: 0 0 15px rgba(255, 0, 0, 0.8);
    }

    #game-over p {
      font-size: 18px;
      color: #fff;
    }

    #game-over .final-score {
      font-size: 36px;
      color: #0f0;
      font-weight: bold;
    }

    #game-over .player-mention {
      font-size: 16px;
      color: #ff0;
      text-shadow: 0 0 10px rgba(255, 255, 0, 0.5);
    }

    #game-over .restart-btn {
      padding: 10px 24px;
      background: #0f0;
      color: #000;
      border: none;
      border-radius: 6px;
      font-family: 'Courier New', monospace;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      pointer-events: auto;
      transition: all 0.2s;
    }

    #game-over .restart-btn:hover {
      background: #0a0;
      transform: scale(1.05);
    }

    @media (min-width: 768px) {
      #game-wrapper {
        width: 800px;
        height: 600px;
      }

      #gameCanvas {
        width: 800px;
        height: 600px;
      }

      #hud {
        padding: 15px 20px;
        flex-direction: row;
      }

      #hud .stat {
        min-width: 100px;
      }

      #hud .stat .label {
        font-size: 10px;
      }

      #hud .stat .value {
        font-size: 20px;
      }

      #restart-btn {
        bottom: 20px;
        padding: 12px 30px;
        font-size: 16px;
      }
    }

    @media (max-width: 767px) {
      #game-wrapper {
        width: 100vw;
        height: 100vh;
      }

      #gameCanvas {
        width: 100vw;
        height: 100vh;
      }

      #hud {
        padding: 8px 10px;
        flex-direction: column;
        gap: 5px;
      }

      #hud .stat {
        min-width: 60px;
        padding: 4px 8px;
      }

      #hud .stat .label {
        font-size: 7px;
      }

      #hud .stat .value {
        font-size: 14px;
      }

      #restart-btn {
        bottom: 10px;
        padding: 8px 16px;
        font-size: 12px;
      }

      #signature {
        font-size: 8px;
        bottom: 5px;
        left: 5px;
      }

      #game-over h1 {
        font-size: 32px;
      }

      #game-over .final-score {
        font-size: 28px;
      }

      #game-over .player-mention {
        font-size: 14px;
      }

      #game-over .restart-btn {
        padding: 8px 16px;
        font-size: 12px;
      }
    }

    @media (max-width: 480px) {
      #game-wrapper {
        width: 100vw;
        height: 100vh;
      }

      #gameCanvas {
        width: 100vw;
        height: 100vh;
      }

      #hud {
        padding: 6px 8px;
      }

      #hud .stat {
        padding: 3px 6px;
        min-width: 40px;
      }

      #hud .stat .label {
        font-size: 6px;
      }

      #hud .stat .value {
        font-size: 12px;
      }

      #restart-btn {
        padding: 6px 12px;
        font-size: 10px;
      }

      #signature {
        font-size: 6px;
        bottom: 3px;
        left: 3px;
      }
    }
  </style>
</head>
<body>
  <div id="game-wrapper">
    <canvas id="gameCanvas"></canvas>

    <!-- Signature -->
    <div id="signature">
      Signature<br>
      <strong>Kossi Jean Bertin</strong>
    </div>

    <!-- HUD -->
    <div id="hud">
      <div class="stat">
        <div class="label">Score</div>
        <div class="value" id="score">0</div>
      </div>
      <div class="stat">
        <div class="label">Niveau</div>
        <div class="value level" id="level">1</div>
      </div>
      <div class="stat">
        <div class="label">FPS</div>
        <div class="value" id="fps">60</div>
      </div>
    </div>

    <!-- Bouton de relance -->
    <button id="restart-btn">RECOMMENCER</button>

    <!-- Ecran Game Over -->
    <div id="game-over">
      <h1>VICTOIRE !</h1>
      <p class="final-score">Score: <span id="final-score">0</span></p>
      <p class="player-mention">Kossi Jean Bertin</p>
      <button id="restart-btn-go" class="restart-btn">Niveau suivant</button>
    </div>
  </div>

  <script>
    // ============================
    // CONFIGURATION
    // ============================
    const CONFIG = {
      canvasWidth: 800,
      canvasHeight: 600,
      ballSpeed: 120,
      maxBallSpeed: 200,
      spawnInterval: 400,
      ballSize: 14,
      playerSize: 20,
      playerSpeed: 350,
      teamName: 'Kossi Jean Bertin',
      teamLogo: 'KJB',
    };

    // ============================
    // CLASSE JOUEUR (Avion)
    // ============================
    class Player {
      constructor(canvas) {
        this.canvas = canvas;
        this.x = canvas.width / 2;
        this.y = canvas.height / 2;
        this.size = CONFIG.playerSize;
        this.speed = CONFIG.playerSpeed;
        this.alive = true;
        this.color = '#ff3333';
        this.trail = [];
      }

      update(deltaTime, mouseX, mouseY) {
        if (!this.alive) return;

        // Suivre la souris
        const dx = mouseX - this.x;
        const dy = mouseY - this.y;
        const dist = Math.sqrt(dx * dx + dy * dy);

        if (dist > 0.1) {
          const maxMove = this.speed * deltaTime;
          const moveX = (dx / dist) * Math.min(maxMove, dist);
          const moveY = (dy / dist) * Math.min(maxMove, dist);
          this.x += moveX;
          this.y += moveY;
        }

        // Limites
        const margin = this.size / 2;
        this.x = Math.max(margin, Math.min(this.canvas.width - margin, this.x));
        this.y = Math.max(margin, Math.min(this.canvas.height - margin, this.y));

        // Trail
        this.trail.push({ x: this.x, y: this.y, life: 1 });
        if (this.trail.length > 10) this.trail.shift();
        for (let i = this.trail.length - 1; i >= 0; i--) {
          this.trail[i].life -= deltaTime * 2;
          if (this.trail[i].life <= 0) this.trail.splice(i, 1);
        }
      }

      draw(ctx) {
        // Traînée
        for (let i = 0; i < this.trail.length; i++) {
          const t = this.trail[i];
          ctx.strokeStyle = `rgba(255, 51, 51, ${t.life * 0.2})`;
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.arc(t.x, t.y, this.size * (1 - i / this.trail.length) * 0.5, 0, Math.PI * 2);
          ctx.stroke();
        }

        ctx.save();
        ctx.translate(this.x, this.y);

        // Corps de l'avion
        ctx.fillStyle = this.color;
        ctx.strokeStyle = 'rgba(255,255,255,0.2)';
        ctx.lineWidth = 2;

        // Corps principal
        ctx.beginPath();
        ctx.moveTo(-14, 0);
        ctx.lineTo(14, 0);
        ctx.lineTo(10, -8);
        ctx.lineTo(12, 8);
        ctx.lineTo(-12, 8);
        ctx.lineTo(-10, -8);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // Ailes
        ctx.beginPath();
        ctx.moveTo(-14, 0);
        ctx.lineTo(-18, -10);
        ctx.lineTo(-14, -4);
        ctx.moveTo(-14, 0);
        ctx.lineTo(-18, 10);
        ctx.lineTo(-14, 4);
        ctx.stroke();

        // Hélice
        const angle = Date.now() / 100;
        ctx.strokeStyle = 'rgba(255,255,255,0.5)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(0, 0, 8, 0, Math.PI * 2);
        ctx.stroke();

        for (let i = 0; i < 2; i++) {
          const a = angle + i * Math.PI;
          ctx.beginPath();
          ctx.moveTo(Math.cos(a) * 8, Math.sin(a) * 8);
          ctx.lineTo(Math.cos(a) * 14, Math.sin(a) * 14);
          ctx.stroke();
        }

        // Queue
        ctx.beginPath();
        ctx.moveTo(12, 0);
        ctx.lineTo(0, -12);
        ctx.moveTo(12, 0);
        ctx.lineTo(0, 12);
        ctx.stroke();

        // Nom du joueur
        ctx.fillStyle = 'rgba(255,255,255,0.7)';
        ctx.font = '12px "Courier New", monospace';
        ctx.fillText(CONFIG.teamLogo, this.x - 16, this.y - this.size - 8);

        ctx.restore();

        // Vie
        ctx.fillStyle = 'rgba(255,255,255,0.7)';
        ctx.font = '14px "Courier New", monospace';
        ctx.fillText('♥', this.x - 6, this.y - this.size - 6);
      }
    }

    // ============================
    // CLASSE BALLE
    // ============================
    class Ball {
      constructor() {
        this.x = Math.random() * CONFIG.canvasWidth;
        this.y = -20;
        this.size = CONFIG.ballSize + Math.random() * 8;
        this.color = this.getRandomColor();
        this.rotation = 0;
        this.speed = CONFIG.ballSpeed + Math.random() * 50;
        this.alive = true;
        this.life = 1 + Math.random() * 0.5;
      }

      getRandomColor() {
        const colors = ['#ff3333', '#33ff33', '#3333ff', '#ff33ff', '#ff8800', '#00ff88', '#8800ff', '#ff0088', '#00ffff', '#ffaa00'];
        return colors[Math.floor(Math.random() * colors.length)];
      }

      update(deltaTime) {
        if (!this.alive) return;

        this.y += this.speed * deltaTime;
        this.rotation += deltaTime * 2;
        this.life -= deltaTime;

        if (this.y > CONFIG.canvasHeight + 20 || this.life <= 0) {
          this.alive = false;
        }
      }

      draw(ctx) {
        if (!this.alive) return;

        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);

        // Cercle avec dégradé
        const radius = this.size / 2;
        const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, radius);
        gradient.addColorStop(0, this.color);
        gradient.addColorStop(1, 'rgba(255,255,255,0.15)');
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(0, 0, radius, 0, Math.PI * 2);
        ctx.fill();

        // Outline
        ctx.strokeStyle = 'rgba(255,255,255,0.5)';
        ctx.lineWidth = 2;
        ctx.stroke();

        // Vie
        const lifePercent = this.life;
        ctx.fillStyle = 'rgba(255,255,255,0.8)';
        const lifeRadius = radius * 0.6;
        const segments = 4;
        for (let i = 0; i < segments; i++) {
          const shouldDraw = lifePercent >= 1 - (i / segments);
          const x = (i - 1.5) * lifeRadius * 2;
          const y = (i - 1.5) * lifeRadius * 2;
          ctx.fillRect(x, y, lifeRadius * 2, lifeRadius * 2);
        }

        // Croix de la cible
        ctx.strokeStyle = 'rgba(255,255,255,0.4)';
        ctx.lineWidth = 1.5;
        const s = radius * 0.35;
        ctx.beginPath();
        ctx.moveTo(-s, -s);
        ctx.lineTo(s, s);
        ctx.moveTo(s, -s);
        ctx.lineTo(-s, s);
        ctx.stroke();

        // Point central
        ctx.fillStyle = 'rgba(255,255,255,0.7)';
        ctx.beginPath();
        ctx.arc(0, 0, 3, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();

        // Label
        ctx.fillStyle = 'rgba(255,255,255,0.6)';
        ctx.font = '10px "Courier New", monospace';
        ctx.fillText('✖', this.x - 4, this.y - radius - 4);
      }

      createExplosion() {
        const color = this.color;
        for (let i = 0; i < 10; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = Math.random() * 100 + 30;
          ctx.save();
          ctx.globalAlpha = 0.6;
          ctx.fillStyle = color;
          ctx.beginPath();
          ctx.arc(this.x, this.y, 1.5, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }
    }

    // ============================
    // CLASSE FLÈCHE
    // ============================
    class Bullet {
      constructor(pos, target, size) {
        this.x = pos.x;
        this.y = pos.y;
        this.targetX = target.x;
        this.targetY = target.y;
        this.size = size;
        this.color = '#ffffff';
        this.speed = 600;
        this.alive = true;
        this.age = 0;
        this.rotation = 0;
      }

      update(deltaTime) {
        if (!this.alive) return;

        const dx = this.targetX - this.x;
        const dy = this.targetY - this.y;
        const dist = Math.sqrt(dx * dx + dy * dy);

        if (dist > 0.1) {
          const maxMove = this.speed * deltaTime;
          const moveX = (dx / dist) * Math.min(maxMove, dist);
          const moveY = (dy / dist) * Math.min(maxMove, dist);
          this.x += moveX;
          this.y += moveY;
        }

        if (dist > 0.1) {
          this.rotation = Math.atan2(dy, dx);
        }

        this.age += deltaTime;

        if (this.age > 1.5 || this.x < -50 || this.x > CONFIG.canvasWidth + 50 || this.y < -50 || this.y > CONFIG.canvasHeight + 50) {
          this.alive = false;
        }
      }

      draw(ctx) {
        if (!this.alive) return;

        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);

        const alpha = 0.8 + Math.sin(this.age * 30) * 0.2;

        // Lueur
        ctx.shadowColor = 'rgba(255, 255, 255, 0.5)';
        ctx.shadowBlur = 20;

        // Flèche
        const s = this.size;
        ctx.fillStyle = this.color;
        ctx.strokeStyle = 'rgba(0,0,0,0.2)';
        ctx.lineWidth = 2;

        // Tête de la flèche
        ctx.beginPath();
        ctx.moveTo(0, -s * 1.8);
        ctx.lineTo(s * 0.8, -s * 0.4);
        ctx.lineTo(s * 0.4, -s * 0.4);
        ctx.lineTo(s * 0.8, s * 0.4);
        ctx.lineTo(s * 1.2, 0);
        ctx.lineTo(s * 0.8, -s * 0.4);
        ctx.lineTo(s * 0.8, s * 0.6);
        ctx.lineTo(s * 0.3, s * 0.6);
        ctx.lineTo(s * 0.3, s * 0.2);
        ctx.lineTo(s * 0.8, s * 0.2);
        ctx.lineTo(s * 0.8, s * 0.6);
        ctx.lineTo(s * 0.3, s * 0.6);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // Train
        ctx.strokeStyle = 'rgba(0,0,0,0.3)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(s * 0.2, 0);
        ctx.lineTo(s * 1.2, 0);
        ctx.stroke();

        // Éclair
        const a = Date.now() / 300;
        ctx.strokeStyle = `rgba(255, 200, 0, ${alpha})`;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(s * 0.5, 0);
        ctx.lineTo(s * 0.5 + Math.cos(a) * s * 0.6, Math.sin(a) * s * 0.6);
        ctx.stroke();

        ctx.restore();
        ctx.shadowBlur = 0;
      }
    }

    // ============================
    // CLASSE GAME
    // ============================
    class Game {
      constructor(canvas) {
        this.canvas = canvas;
        this.ctx = canvas.getContext('2d');
        this.canvas.width = CONFIG.canvasWidth;
        this.canvas.height = CONFIG.canvasHeight;

        // État
        this.score = 0;
        this.level = 1;
        this.currentPhase = 'MENU'; // MENU, PLAYING, VICTORY, GAMEOVER
        this.fps = 60;
        this.lastTime = 0;
        this.frameCount = 0;
        this.frameTimer = 0;

        // Éléments
        this.balls = [];
        this.bullets = [];
        this.player = new Player(canvas);

        // Souris
        this.mouseX = 0;
        this.mouseY = 0;
        this.mouseDown = false;

        // Timer
        this.lastFire = 0;
        this.lastSpawn = 0;
        this.spawnTimer = 0;

        // Écouteurs
        this.canvas.addEventListener('mousemove', (e) => this.onMouseMove(e));
        this.canvas.addEventListener('mousedown', (e) => this.onMouseDown(e));
        this.canvas.addEventListener('mouseup', () => (this.mouseDown = false));
        this.canvas.addEventListener('mouseleave', () => (this.mouseDown = false));

        document.getElementById('restart-btn').addEventListener('click', () => this.resetGame());
        document.getElementById('restart-btn-go').addEventListener('click', () => this.nextLevel());

        this.lastTime = performance.now();
        this.frameTimer = 0;
        this.frameCount = 0;

        this.loop();
      }

      onMouseMove(e) {
        const rect = this.canvas.getBoundingClientRect();
        const scaleX = this.canvas.width / rect.width;
        const scaleY = this.canvas.height / rect.height;
        this.mouseX = (e.clientX - rect.left) * scaleX;
        this.mouseY = (e.clientY - rect.top) * scaleY;
      }

      onMouseDown(e) {
        if (this.currentPhase !== 'PLAYING') return;
        this.mouseDown = true;
        this.shoot();
      }

      resetGame() {
        this.balls = [];
        this.bullets = [];
        this.score = 0;
        this.level = 1;
        this.currentPhase = 'PLAYING';
        this.player.x = this.canvas.width / 2;
        this.player.y = this.canvas.height / 2;
        this.player.trail = [];
        this.lastFire = 0;
        this.lastSpawn = 0;
        this.lastTime = performance.now();
        document.getElementById('game-over').style.display = 'none';
        document.getElementById('hud').style.display = 'flex';
      }

      shoot() {
        if (this.currentPhase !== 'PLAYING') return;
        if (this.bullets.length >= 20) return;

        const now = performance.now();
        const fireRate = 300;

        if (now - this.lastFire < fireRate) return;
        this.lastFire = now;

        this.bullets.push(new Bullet(
          { x: this.player.x, y: this.player.y },
          { x: this.mouseX, y: this.mouseY },
          CONFIG.ballSize
        ));
      }

      createBall() {
        const ball = new Ball();
        ball.x = Math.random() * (CONFIG.canvasWidth - 100) + 50;
        ball.y = -30;
        ball.speed = CONFIG.ballSpeed + Math.random() * 60;
        ball.size = CONFIG.ballSize + Math.random() * 10;
        ball.life = 1 + Math.random() * 0.5;
        this.balls.push(ball);
      }

      update(deltaTime) {
        if (this.currentPhase !== 'PLAYING') return;

        this.player.update(deltaTime, this.mouseX, this.mouseY);
        this.spawnTimer += deltaTime;

        // Générer des balles
        const interval = CONFIG.spawnInterval / (1 + this.level * 0.1);
        if (this.spawnTimer >= interval) {
          this.spawnTimer = 0;
          this.createBall();

          // Plus de balles au niveau supérieur
          const count = this.level <= 3 ? (Math.random() < 0.5 ? 1 : 2) : Math.min(3, Math.floor(this.level / 5) + 1);
          for (let i = 0; i < count; i++) {
            this.createBall();
          }
        }

        // Mettre à jour les balles
        for (let i = this.balls.length - 1; i >= 0; i--) {
          this.balls[i].update(deltaTime);
          if (!this.balls[i].alive) {
            this.balls.splice(i, 1);
          }
        }

        // Mettre à jour les flèches
        for (let i = this.bullets.length - 1; i >= 0; i--) {
          this.bullets[i].update(deltaTime);
          if (!this.bullets[i].alive) {
            this.bullets.splice(i, 1);
          }
        }

        // Collisions flèche - balle
        for (let i = this.bullets.length - 1; i >= 0; i--) {
          const b = this.bullets[i];
          if (!b.alive) continue;

          for (let j = this.balls.length - 1; j >= 0; j--) {
            const t = this.balls[j];
            if (!t.alive) continue;

            const dx = b.x - t.x;
            const dy = b.y - t.y;
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist < (b.size / 2 + t.size / 2)) {
              // Hit !
              b.alive = false;
              t.alive = false;
              this.score += 10 + this.level * 2;
              t.createExplosion();
              this.balls.splice(j, 1);
              break;
            }
          }
        }

        // Difficulté : niveau augmente toutes les 30 points
        if (this.score > 0 && this.score % 30 === 0 && this.level < 50) {
          this.level++;
        }

        // Vérifier si on a gagné (toutes les balles sont mortes)
        const allBallsDestroyed = this.balls.length === 0;
        const allBulletsDestroyed = this.bullets.length === 0;
        const isLevel1 = this.level === 1;

        if (allBallsDestroyed && allBulletsDestroyed) {
          if (isLevel1) {
            // Niveau 1 terminé
            this.currentPhase = 'VICTORY';
            this.handleVictory();
          } else {
            // Niveau supérieur terminé
            this.currentPhase = 'VICTORY';
            this.handleVictory();
          }
        }
      }

      handleVictory() {
        this.currentPhase = 'VICTORY';
        this.isPlaying = false;
        document.getElementById('hud').style.display = 'none';

        const finalScore = this.score;
        const finalLevel = this.level;

        // Afficher le message de victoire
        document.getElementById('final-score').innerText = `${finalScore} - Niveau ${finalLevel}`;
        document.getElementById('game-over').style.display = 'flex';
        document.getElementById('game-over').querySelector('h1').innerText = 'VICTOIRE !';
        document.getElementById('game-over').querySelector('.final-score').innerText = finalScore;
        document.getElementById('game-over').querySelector('.player-mention').innerText = `Fait par : ${CONFIG.teamName}`;
        document.getElementById('game-over').querySelector('.restart-btn').innerText = 'Niveau suivant';
        document.getElementById('game-over').querySelector('.restart-btn').onclick = () => this.nextLevel();
      }

      nextLevel() {
        if (this.level >= 50) {
          // Excellence atteinte
          this.currentPhase = 'VICTORY';
          this.isPlaying = false;

          document.getElementById('hud').style.display = 'none';
          document.getElementById('game-over').style.display = 'flex';
          document.getElementById('game-over').querySelector('h1').innerText = 'EXCELLENCE ATTEINTE !';
          document.getElementById('game-over').querySelector('.final-score').innerText = `Score: ${this.score} - Niveau ${this.level}`;
          document.getElementById('game-over').querySelector('.player-mention').innerText = `Collection terminée - ${CONFIG.teamName}`;
          document.getElementById('game-over').querySelector('.restart-btn').innerText = 'Menu principal';
          document.getElementById('game-over').querySelector('.restart-btn').onclick = () => {
            document.getElementById('game-over').style.display = 'none';
            document.getElementById('hud').style.display = 'flex';
            this.resetGame();
          };
          return;
        }

        // Réinitialiser pour le niveau suivant
        this.score = 0;
        this.balls = [];
        this.bullets = [];
        this.currentPhase = 'PLAYING';
        this.isPlaying = true;
        this.player.x = this.canvas.width / 2;
        this.player.y = this.canvas.height / 2;
        this.player.trail = [];
        this.lastFire = 0;
        this.lastSpawn = 0;
        this.lastTime = performance.now();

        document.getElementById('hud').style.display = 'flex';
        document.getElementById('game-over').style.display = 'none';
      }

      loop() {
        const now = performance.now();
        const deltaTime = Math.min((now - this.lastTime) / 1000, 0.05);
        this.lastTime = now;

        this.update(deltaTime);
        this.render(deltaTime);

        this.frameTimer += deltaTime;
        this.frameCount++;

        if (this.frameTimer >= 1) {
          this.fps = this.frameCount;
          this.frameCount = 0;
          this.frameTimer = 0;
          document.getElementById('fps').textContent = `${this.fps}`;
        }

        requestAnimationFrame(() => this.loop());
      }

      render(deltaTime) {
        const ctx = this.ctx;
        const W = CONFIG.canvasWidth;
        const H = CONFIG.canvasHeight;

        // Fond
        const gradient = ctx.createLinearGradient(0, 0, 0, H);
        gradient.addColorStop(0, '#030308');
        gradient.addColorStop(0.5, '#06060d');
        gradient.addColorStop(1, '#0a0a14');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, W, H);

        // Poussière
        for (let i = 0; i < 15; i++) {
          ctx.fillStyle = `rgba(255,255,255,${0.01 + Math.random() * 0.03})`;
          ctx.beginPath();
          ctx.arc(Math.random() * W, Math.random() * H * 0.4, Math.random() * 8 + 3, 0, Math.PI * 2);
          ctx.fill();
        }

        // Balles
        for (const b of this.balls) {
          b.draw(ctx);
        }

        // Balles mortes (effet d'explosion)
        for (const b of this.balls) {
          if (!b.alive) {
            b.createExplosion();
          }
        }

        // Flèches
        for (const b of this.bullets) {
          b.draw(ctx);
        }

        // Joueur
        this.player.draw(ctx);

        // Visée
        if (this.mouseDown && this.currentPhase === 'PLAYING') {
          ctx.save();
          ctx.strokeStyle = 'rgba(255,255,255,0.4)';
          ctx.lineWidth = 2;
          ctx.setLineDash([4, 4]);
          ctx.beginPath();
          ctx.moveTo(this.player.x, this.player.y);
          ctx.lineTo(this.mouseX, this.mouseY);
          ctx.stroke();

          ctx.fillStyle = 'rgba(255,255,255,0.7)';
          ctx.beginPath();
          ctx.arc(this.mouseX, this.mouseY, 4, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
          ctx.restore();
        }

        // Score
        ctx.save();
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(0, 0, 160, 45);
        ctx.fillStyle = '#fff';
        ctx.font = '20px "Courier New", monospace';
        ctx.fillText(`Score: ${this.score}`, 12, 36);
        ctx.restore();

        // Niveau
        ctx.save();
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(W - 160, 0, 160, 45);
        ctx.fillStyle = '#fff';
        ctx.font = '20px "Courier New", monospace';
        ctx.fillText(`Niveau: ${this.level}`, W - 150, 36);
        ctx.restore();

        // FPS
        ctx.save();
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(10, H - 35, 100, 22);
        ctx.fillStyle = '#fff';
        ctx.font = '14px "Courier New", monospace';
        ctx.fillText(`FPS: ${this.fps}`, 18, H - 16);
        ctx.restore();

        // State messages
        if (this.currentPhase === 'MENU') {
          ctx.save();
          ctx.fillStyle = 'rgba(255,255,255,0.5)';
          ctx.font = '18px "Courier New", monospace';
          ctx.fillText('PRÊT À JOUER', this.canvas.width / 2 - 100, this.canvas.height / 2);
          ctx.restore();
        }

        if (this.currentPhase === 'VICTORY') {
          ctx.save();
          ctx.fillStyle = 'rgba(255, 255, 0, 0.6)';
          ctx.font = '18px "Courier New", monospace';
          ctx.fillText(`Niveau ${this.level} terminé - ${CONFIG.teamName}`, this.canvas.width / 2 - 150, this.canvas.height / 2);
          ctx.restore();
        }
      }
    }

    // ============================
    // INIT
    // ============================
    const canvas = document.getElementById('gameCanvas');
    const game = new Game(canvas);

    // Ajuster la taille du canvas
    function resizeCanvas() {
      const wrapper = document.getElementById('game-wrapper');
      const canvas = document.getElementById('gameCanvas');

      const width = wrapper.clientWidth;
      const height = wrapper.clientHeight;

      // Garder le ratio 800x600
      const targetRatio = 800 / 600;
      const currentRatio = width / height;

      if (currentRatio > targetRatio) {
        // Largeur limitante
        canvas.style.width = '100%';
        canvas.style.height = 'auto';
        canvas.width = width;
        canvas.height = width / targetRatio;
      } else {
        // Hauteur limitante
        canvas.style.height = '100%';
        canvas.style.width = 'auto';
        canvas.height = height;
        canvas.width = height * targetRatio;
      }
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
  </script>
